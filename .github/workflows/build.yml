name: Build SmartTube VLESS fork

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'
      - 'SmartTube-security-vless-v10.patch'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Check out fork
        uses: actions/checkout@v4

      - name: Clone SmartTube source and apply v10 patch
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/yuliskov/SmartTube.git smarttube_src
          patch --batch --forward --fuzz=0 -p2 -d smarttube_src < SmartTube-security-vless-v10.patch

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Go for libXray
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install \
            'platform-tools' \
            'platforms;android-33' \
            'build-tools;33.0.2' \
            'ndk;21.0.6113669'

      - name: Prepare SmartTube dependencies
        working-directory: smarttube_src
        run: |
          chmod +x tools/prepare-build.sh tools/build-libxray-aar.sh
          ./tools/prepare-build.sh

      - name: Set minSdk to 21 for libXray compatibility
        working-directory: smarttube_src
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          candidates = [
              Path("smarttubetv/build.gradle"),
              Path("common/build.gradle")
          ]

          changed = []

          for path in candidates:
              if not path.exists():
                  continue

              data = path.read_text()
              old = "minSdkVersion project.properties.minSdkVersion"

              if old in data:
                  path.write_text(
                      data.replace(old, "minSdkVersion 21")
                  )
                  changed.append(str(path))

          if not changed:
              raise SystemExit(
                  "Could not find the expected minSdk declaration; stopping safely."
              )

          print("Updated minSdk to 21 in: " + ", ".join(changed))
          PY

      - name: Build libXray AAR
        working-directory: smarttube_src
        run: ./tools/build-libxray-aar.sh

      - name: Run unit tests and build SmartTube APK
        working-directory: smarttube_src
        run: |
          ./gradlew --no-daemon \
            testStstableDebugUnitTest \
            assembleStstableDebug \
            --stacktrace

      - name: Collect APK and checksums
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          find smarttube_src/smarttubetv/build/outputs/apk \
            -type f -name '*.apk' -exec cp '{}' dist/ \;

          cp smarttube_src/common/libs/libXray.aar dist/

          sha256sum dist/* > dist/SHA256SUMS.txt

          test -n "$(find dist -maxdepth 1 -name '*.apk' -print -quit)"

      - name: Upload APK and AAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: smarttube-vless-fork-debug
          path: dist/
          if-no-files-found: error
          retention-days: 14
