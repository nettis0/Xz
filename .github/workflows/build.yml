name: Build SmartTube VLESS fork

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Clone SmartTube source and apply patch
        run: |
          git clone --depth 1 https://github.com/yuliskov/SmartTube.git smarttube_src
          patch --batch --forward -p2 -d smarttube_src < SmartTube-security-vless-v9.patch

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Android SDK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O sdk-tools.zip
          unzip -q sdk-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          rm sdk-tools.zip
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install \
            'platform-tools' \
            'platforms;android-33' \
            'build-tools;33.0.2' \
            'ndk;21.0.6113669'

      - name: Switch Java to 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Fix application minSdk
        working-directory: smarttube_src
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("smarttubetv/src/main/AndroidManifest.xml")
          if not manifest.exists():
              raise SystemExit(f"Manifest not found: {manifest}")

          text = manifest.read_text()

          if "xmlns:android=" not in text:
              raise SystemExit("Android namespace not found in manifest")

          if "xmlns:tools=" not in text:
              text = text.replace(
                  "xmlns:android=",
                  'xmlns:tools="http://schemas.android.com/tools"\n    xmlns:android=',
                  1
              )

          text, count = re.subn(
              r'<uses-sdk\b[^>]*/?>',
              '<uses-sdk android:minSdkVersion="21" />',
              text,
              count=1
          )

          if count == 0:
              text = re.sub(
                  r'(<manifest\b[^>]*>)',
                  r'\1\n    <uses-sdk android:minSdkVersion="21" />',
                  text,
                  count=1
              )

          manifest.write_text(text)
          print("Updated application manifest minSdk to 21")
          print("\n".join(line for line in text.splitlines() if "uses-sdk" in line))
          PY

      - name: Prepare build and submodules
        working-directory: smarttube_src
        run: |
          chmod +x ./tools/prepare-build.sh ./tools/build-libxray-aar.sh
          ./tools/prepare-build.sh

      - name: Build libXray AAR
        working-directory: smarttube_src
        run: ./tools/build-libxray-aar.sh

      - name: Verify minSdk
        working-directory: smarttube_src
        run: |
          grep -n "uses-sdk" smarttubetv/src/main/AndroidManifest.xml
          grep -n "minSdk" smarttubetv/build.gradle || true

      - name: Build SmartTube APK
        working-directory: smarttube_src
        run: ./gradlew --no-daemon assembleStstableDebug --stacktrace --info

      - name: Collect APK and checksums
        if: success()
        run: |
          mkdir -p dist
          find smarttube_src/smarttubetv/build/outputs/apk -type f -name '*.apk' -exec cp '{}' dist/ \;
          cp smarttube_src/common/libs/libXray.aar dist/
          sha256sum dist/* > dist/SHA256SUMS.txt
          test -n "$(find dist -maxdepth 1 -name '*.apk' -print -quit)"

      - name: Upload APK and AAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: smarttube-vless-fork-debug
          path: dist/
          if-no-files-found: error
          retention-days: 14
