name: Build SmartTube Modern UI + VLESS

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'
      - 'SmartTube-security-vless-v10.patch'
      - 'tools/apply-modern-ui-config.py'
      - 'tools/fix-shorts-ui.py'
      - 'tools/apply-release-v11.py'
      - 'tools/apply-shorts-continuation-v11.py'
      - 'tools/verify-release-v11.py'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Check out fork
        uses: actions/checkout@v4

      - name: Clone SmartTube modern UI source and apply VLESS patch
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch feature/modern-ui https://github.com/mramundo/SmartTube.git smarttube_src
          EXPECTED_COMMIT='eebce9afde01e658b8d7b94464f35cc3b8f9e9df'
          ACTUAL_COMMIT="$(git -C smarttube_src rev-parse HEAD)"
          if [ "$ACTUAL_COMMIT" != "$EXPECTED_COMMIT" ]; then
            echo "Unexpected modern UI source revision: $ACTUAL_COMMIT"
            exit 1
          fi
          patch --batch --forward --fuzz=0 -p2 -d smarttube_src < SmartTube-security-vless-v10.patch

      - name: Apply modern UI navigation configuration
        run: python3 ../tools/apply-modern-ui-config.py
        working-directory: smarttube_src

      - name: Fix Shorts navigation, details and social actions
        run: python3 ../tools/fix-shorts-ui.py
        working-directory: smarttube_src

      - name: Apply Shorts v11 feed, gestures, microphone and settings fixes
        run: python3 ../tools/apply-release-v11.py
        working-directory: smarttube_src

      - name: Continue Shorts playback across feed pages
        run: python3 ../tools/apply-shorts-continuation-v11.py
        working-directory: smarttube_src

      - name: Verify v11 UI changes and preserved settings
        run: python3 ../tools/verify-release-v11.py
        working-directory: smarttube_src

      - name: Set up Java 17 for Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install \
            'platform-tools' \
            'platforms;android-33' \
            'build-tools;33.0.2' \
            'ndk;21.0.6113669'

      - name: Switch to Java 11 for SmartTube
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Go for libXray
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare SmartTube dependencies
        working-directory: smarttube_src
        run: |
          chmod +x tools/prepare-build.sh tools/build-libxray-aar.sh
          ./tools/prepare-build.sh

      - name: Fix SharedModules Kotlin compatibility
        working-directory: smarttube_src
        shell: bash
        run: |
          set -euo pipefail
          FILE="$(find . -type f -name PlayerResultExtensions.kt -print -quit)"
          test -n "$FILE"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source = path.read_text()
          old = "Helpers.containsIgnoreCase(dubbedLanguages, track.languageCode)"
          new = "dubbedLanguages.any { it.equals(track.languageCode, ignoreCase = true) }"

          if old in source:
              source = source.replace(old, new)
          elif new not in source:
              raise SystemExit("Expected Kotlin expression not found.")

          path.write_text(source)
          print("Kotlin compatibility fix applied.")
          PY

      - name: Fix SharedModules Android Auto compatibility
        working-directory: smarttube_src
        shell: bash
        run: |
          set -euo pipefail

          FILE="$(find SharedModules -type f -path '*/sharedutils/helpers/Helpers.java' -print -quit)"
          test -n "$FILE"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source = path.read_text()

          field = "    private static Boolean sIsAndroidAuto;"

          method = """
              public static boolean isAndroidAuto() {
                  if (sIsAndroidAuto != null) {
                      return sIsAndroidAuto;
                  }

                  sIsAndroidAuto = Helpers.equalsAny(
                      Helpers.getDeviceName(), "rkpx3 (rkpx3)"
                  );

                  return sIsAndroidAuto;
              }
          """

          if "public static boolean isAndroidAuto()" not in source:
              class_marker = "public final class Helpers {"
              if class_marker not in source:
                  raise SystemExit("Helpers class declaration not found.")

              source = source.replace(
                  class_marker,
                  class_marker + "\n" + field,
                  1
              )

              closing = source.rfind("}")
              if closing < 0:
                  raise SystemExit("Helpers class closing brace not found.")

              source = source[:closing] + method + "\n" + source[closing:]

          path.write_text(source)
          print("Android Auto compatibility fix applied.")
          PY

      - name: Fix MediaServiceCore Java compatibility
        working-directory: smarttube_src
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "MediaServiceCore/youtubeapi/src/main/java/com/liskovsoft/"
              "youtubeapi/videoinfo/models/VideoInfo.java"
          )

          source = path.read_text()

          replacements = {
              "!Helpers.isNullOrEmpty(mTranslationLanguages) && !Helpers.isNullOrEmpty(mCaptionTracks)":
              "mTranslationLanguages != null && !mTranslationLanguages.isEmpty() && "
              "mCaptionTracks != null && !mCaptionTracks.isEmpty()",

              "!Helpers.containsIgnoreCase(dubbedLanguages, track.getLanguageCode())":
              "!containsIgnoreCase(dubbedLanguages, track.getLanguageCode())"
          }

          for old, new in replacements.items():
              if old in source:
                  source = source.replace(old, new)
              elif new not in source:
                  raise SystemExit("Expected Java expression not found: " + old)

          marker = "    private CaptionTrack findOriginTrack(List<CaptionTrack> captionTracks) {"

          helper = """    private boolean containsIgnoreCase(List<String> values, String value) {
              if (values == null || value == null) {
                  return false;
              }

              for (String item : values) {
                  if (item != null && item.equalsIgnoreCase(value)) {
                      return true;
                  }
              }

              return false;
          }

          """

          if "private boolean containsIgnoreCase(List<String> values, String value)" not in source:
              if marker not in source:
                  raise SystemExit("Could not find insertion point for Java helper.")
              source = source.replace(marker, helper + marker)

          path.write_text(source)
          print("VideoInfo.java compatibility fixes applied.")
          PY

      - name: Fix VLESS tests to use Robolectric
        working-directory: smarttube_src
        shell: bash
        run: |
          set -euo pipefail

          FILE="common/src/test/java/com/liskovsoft/smartyoutubetv2/common/proxy/vless/VlessConfigBuilderTest.java"
          test -f "$FILE"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source = path.read_text()

          junit_import = "import org.junit.Test;"
          robo_imports = (
              "import org.junit.runner.RunWith;\n"
              "import org.robolectric.RobolectricTestRunner;"
          )

          if "import org.robolectric.RobolectricTestRunner;" not in source:
              if junit_import not in source:
                  raise SystemExit("JUnit import not found.")
              source = source.replace(junit_import, junit_import + "\n" + robo_imports, 1)

          class_marker = "public class VlessConfigBuilderTest {"
          annotated_class = "@RunWith(RobolectricTestRunner.class)\n" + class_marker

          if "@RunWith(RobolectricTestRunner.class)" not in source:
              if class_marker not in source:
                  raise SystemExit("VLESS test class declaration not found.")
              source = source.replace(class_marker, annotated_class, 1)

          path.write_text(source)
          print("VLESS tests configured to run with Robolectric.")
          PY

      - name: Set minSdk to 21 for libXray compatibility
        working-directory: smarttube_src
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          candidates = [
              Path("smarttubetv/build.gradle"),
              Path("common/build.gradle")
          ]

          changed = []

          for path in candidates:
              if not path.exists():
                  continue

              data = path.read_text()
              old = "minSdkVersion project.properties.minSdkVersion"

              if old in data:
                  path.write_text(data.replace(old, "minSdkVersion 21"))
                  changed.append(str(path))

          if not changed:
              raise SystemExit("Could not find the expected minSdk declaration.")

          print("Updated minSdk to 21 in: " + ", ".join(changed))
          PY

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('smarttube_src/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build libXray AAR
        working-directory: smarttube_src
        run: ./tools/build-libxray-aar.sh

      - name: Run VLESS unit tests only
        working-directory: smarttube_src
        run: |
          ./gradlew --no-daemon \
            :common:testStstableDebugUnitTest \
            --tests 'com.liskovsoft.smartyoutubetv2.common.proxy.vless.VlessConfigBuilderTest' \
            --tests 'com.liskovsoft.smartyoutubetv2.common.prefs.MainUIDataModernUiTest' \
            --stacktrace

      - name: Build SmartTube APK
        working-directory: smarttube_src
        run: |
          ./gradlew --no-daemon \
            :smarttubetv:assembleStstableDebug \
            --stacktrace

      - name: Collect APK and checksums
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find smarttube_src/smarttubetv/build/outputs/apk -type f -name '*.apk' -exec cp '{}' dist/ \;
          cp smarttube_src/common/libs/libXray.aar dist/
          sha256sum dist/* > dist/SHA256SUMS.txt
          test -n "$(find dist -maxdepth 1 -name '*.apk' -print -quit)"

      - name: Upload APK and AAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: smarttube-vless-fork-debug
          path: dist/
          if-no-files-found: error
          retention-days: 14
