name: Build SmartTube VLESS fork

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

            - name: Install Android SDK components
        uses: android-actions/setup-android@v3
        env:
          SKIP_JDK_VERSION_CHECK: "true"
        - name: Download SmartTube source
        run: git clone --depth 1 --recurse-submodules https://github.com/yuliskov/SmartTube.git source

      - name: Apply VLESS patch
        run: patch --batch --forward -p3 -d source < SmartTube-security-vless-v9.patch

      - name: Install Android components
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;21.0.6113669"

      - name: Build Xray
        working-directory: source
        run: bash tools/build-libxray-aar.sh

      - name: Build APK
        working-directory: source
        run: ./gradlew --no-daemon assembleStstableDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartTube-VLESS-APK
          path: source/smarttubetv/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
